<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Dynamic Pulse Ring Animation -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #a5b4fc;
    }
    
    /* Subtle Dynamic Animations in background elements */
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.3; }
      50% { transform: scale(1.05); opacity: 0.7; }
      100% { transform: scale(0.95); opacity: 0.3; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }
    .anim-ring {
      transform-origin: 1000px 175px;
      animation: pulseRing 6s infinite ease-in-out;
    }
    .anim-particle {
      animation: floatParticle 4s infinite ease-in-out;
    }
    .anim-particle-delayed {
      animation: floatParticle 5s infinite ease-in-out 2s;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 240 0 L 240 350 M 480 0 L 480 350 M 720 0 L 720 350 M 960 0 L 960 350" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Background Dynamic Aperture / Camera Focus Graphic (positioned safely away from foreground text) -->
  <g class="anim-ring">
    <circle cx="1000" cy="175" r="120" stroke="url(#ringGrad)" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="10 15"/>
    <circle cx="1000" cy="175" r="90" stroke="url(#accentGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
    <circle cx="1000" cy="175" r="60" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.6" stroke-dasharray="6 6"/>
    <!-- Camera Lens Focus Reticle -->
    <path d="M 970 175 L 955 175 M 1030 175 L 1045 175 M 1000 145 L 1000 130 M 1000 205 L 1000 220" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="80" r="100" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="950" cy="250" r="120" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>

  <!-- Dynamic Floating Decorative Pills/Nodes (Background/Side) -->
  <g class="anim-particle">
    <rect x="850" y="70" width="120" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="910" y="91" text-anchor="middle" class="badge-text" font-size="12">📸 HDR+ AI</text>
  </g>
  <g class="anim-particle-delayed">
    <rect x="920" y="240" width="130" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="985" y="261" text-anchor="middle" class="badge-text" font-size="12">🎨 3D LUT Shaders</text>
  </g>

  <!-- Foreground Content Block (Clear & Legible) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <rect x="0" y="65" width="230" height="34" rx="17" fill="url(#accentGrad)"/>
    <text x="115" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="1">CURATED AWESOME LIST</text>

    <!-- Main Title -->
    <text x="0" y="155" class="title">Awesome AI Camera App 📸✨</text>

    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle">Computational Photography • AI Enhancement • LUT Color Grading • Manual Controls</text>

    <!-- Key Highlights / Badges in Banner -->
    <g transform="translate(0, 240)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="18" r="6" fill="#10b981"/>
      <text x="36" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">Mobile &amp; Linux</text>

      <!-- Item 2 -->
      <rect x="175" y="0" width="170" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="195" cy="18" r="6" fill="#3b82f6"/>
      <text x="211" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">Open-Source AI</text>

      <!-- Item 3 -->
      <rect x="360" y="0" width="170" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="380" cy="18" r="6" fill="#8b5cf6"/>
      <text x="396" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">SaaS &amp; Market Data</text>
    </g>
  </g>
</svg>
